<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#06060e;color:#fff}body{background:radial-gradient(ellipse 60% 26% at 0% 0%,#28104488,transparent),radial-gradient(ellipse 70% 35% at 100% 100%,#16124f66,transparent),#070710;min-height:100dvh}

.top{height:79px;padding:22px 22px 8px;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}.brand{font-size:22px;font-weight:1000;letter-spacing:-1px;display:flex;gap:9px;align-items:center}.brand em{font-style:normal;color:#f3c559}.tiny{font-size:11px;color:#f3c559;letter-spacing:.5px;font-weight:750;margin-left:2px}.top .brand{font-size:15px;letter-spacing:.35px;line-height:1.25}.topBtns{display:flex;gap:8px;align-items:center}.round{width:39px;height:39px;display:grid;place-items:center;background:#ffffff11;border:1px solid #ffffff27;border-radius:13px;color:#fff;font-size:19px;box-shadow:0 7px 18px #0004}.page{padding:16px 23px 105px;position:relative;z-index:1;animation:appear .25s ease-out;min-height:calc(100dvh - 88px)}@keyframes appear{from{opacity:.45;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.eyebrow{display:inline-block;margin:8px 0 14px;padding:8px 16px;background:#c75eeb25;color:#f7afff;font-size:10px;font-weight:900;letter-spacing:2.2px;border:1px solid #b766f055;border-radius:100px}.hero{text-align:center;padding-top:23px}.hero h1{font-size:clamp(51px,14vw,75px);font-weight:1000;line-height:.99;letter-spacing:-3.8px;margin:10px auto 16px;text-shadow:0 6px 25px #0009;max-width:400px}.hero h1 .gradient{background:linear-gradient(105deg,#fcad40,#ff4aac 48%,#8d65ff);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{color:#b7b3ce;font-size:14px;line-height:1.7;max-width:320px;margin:0 auto}.heroArt{height:203px;border-radius:28px;margin:30px 2px 21px;background:radial-gradient(circle at 52% 43%,#c245f870,transparent 32%),radial-gradient(circle at 38% 67%,#ffad2640,transparent 34%),radial-gradient(circle at 70% 72%,#4776fb57,transparent 38%),linear-gradient(145deg,#25133e,#141932);border:1px solid #ffffff25;box-shadow:inset 0 0 30px #ffffff08,0 21px 40px #0007;position:relative;overflow:hidden;display:grid;place-items:center}.heroArt .bigEmoji{font-size:103px;filter:drop-shadow(0 12px 4px #0005);transform:rotate(-7deg)}.heroArt img{width:100%;height:100%;object-fit:cover}.heroArt .float{position:absolute;font-size:28px}.heroArt .f1{left:15%;top:17%;transform:rotate(19deg)}.heroArt .f2{right:14%;top:22%;transform:rotate(-22deg)}.heroArt .f3{right:23%;bottom:11%;transform:rotate(23deg)}
.ctaTitle{text-align:center;font-weight:900;letter-spacing:.9px;font-size:11px;color:#cbc9e1;margin:18px 0 13px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bigButton{border:0;border-radius:20px;min-height:110px;padding:15px 11px 13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;font-size:14px;font-weight:950;line-height:1.3;text-align:center;box-shadow:0 8px 0 #0008,0 17px 30px #0006,inset 0 2px 1px #ffffff75;position:relative;overflow:hidden;text-shadow:0 2px 5px #0006}.bigButton:before,.choiceBtn:before{content:"";position:absolute;inset:0;background:linear-gradient(165deg,#ffffff55,transparent 47%);pointer-events:none}.bigButton .emoji,.choiceBtn .emoji{font-size:33px;z-index:1}.bigButton .buttonPhoto,.choiceBtn .buttonPhoto{max-height:45px;max-width:80%;object-fit:contain;border-radius:7px;position:relative;z-index:1}.bigButton span,.choiceBtn span{position:relative;z-index:1}.hint{text-align:center;color:#77748e;font-size:11px;margin-top:24px}.back{border:0;background:#ffffff12;color:#e4e1f7;border-radius:14px;padding:12px 15px;font-size:13px;font-weight:750}.pageTitle{font-size:33px;letter-spacing:-1px;line-height:1.12;margin:25px 0 8px;font-weight:1000}.pageDesc{font-size:13px;color:#adaac6;line-height:1.7;margin:6px 0 21px}.four{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:21px}.choiceBtn{aspect-ratio:1/1;border:0;border-radius:26px;color:#fff;font-weight:1000;position:relative;overflow:hidden;box-shadow:0 9px 0 #0008,0 20px 30px #0008,inset 0 2px 2px #ffffff8a;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px;padding:15px;text-shadow:0 2px 5px #0008}.choiceBtn .emoji{font-size:53px}.choiceBtn .buttonPhoto{max-height:92px}.choiceBtn span{font-size:17px}.group{display:flex;flex-direction:column;gap:11px;margin-top:22px}.option{width:100%;display:flex;align-items:center;text-align:left;gap:12px;border-radius:17px;padding:13px 15px;border:1px solid #ffffff26;background:#232339;color:#fff;min-height:65px;box-shadow:0 5px 0 #0007,0 13px 15px #0004;font-weight:820;font-size:16px}.option .optIcon{font-size:27px;width:40px;text-align:center}.option .optImg{width:42px;height:42px;border-radius:9px;object-fit:cover}.option .chev{margin-left:auto;color:#fff9;font-size:20px}.field{width:100%;background:#202035;color:#fff;border:1px solid #6a638d;border-radius:15px;padding:15px 16px;outline:none;font-size:14px}.field:focus{border-color:#ea76ed;box-shadow:0 0 0 3px #dd66ff22}.field::placeholder{color:#8f89a9}textarea.field{min-height:115px;resize:vertical}.fieldLabel{font-size:12px;color:#b6b2d0;font-weight:750;display:block;margin:19px 0 8px}.primary{width:100%;border:0;border-radius:17px;color:#171320;font-weight:1000;font-size:17px;background:linear-gradient(105deg,#ffca4d,#ffa348);box-shadow:0 7px 0 #815020,0 15px 25px #0008;padding:19px 13px;margin-top:16px}.address{padding:25px 20px;border-radius:25px;background:linear-gradient(145deg,#22203f,#19192e);border:1px solid #8070a144;box-shadow:0 20px 35px #0008;text-align:center;margin-top:25px}.address .pin{font-size:58px}.address strong{font-size:24px;display:block;margin:14px 0 7px}.address p{color:#c2bdd9;white-space:pre-wrap;line-height:1.6}.endMedia{margin:23px 0;background:linear-gradient(145deg,#2b2445,#1c1b3a);min-height:195px;border-radius:20px;display:grid;place-items:center;overflow:hidden;border:1px solid #ffffff23}.endMedia img,.endMedia video{width:100%;max-height:400px;object-fit:contain}.endMessage{text-align:center;font-size:31px;font-weight:1000;line-height:1.2;margin:35px auto 18px}.bebot{border:2px dashed #a36cdd;background:#ffffff07;border-radius:24px;overflow:hidden;min-height:280px;display:grid;place-items:center;text-align:center;margin:27px 0}.bebot img{width:100%;height:auto;max-height:390px;object-fit:contain}.step{font-size:12px;color:#ecb9f4;margin:9px 0 0;font-weight:800;letter-spacing:1px}.pill{font-size:11px;display:inline-flex;border-radius:100px;padding:7px 11px;background:#45405b;color:#fff;font-weight:700}.bottomNote{text-align:center;font-size:10px;color:#706d86;position:relative;margin:16px 0 0}
.overlay{position:fixed;inset:0;background:#000c;backdrop-filter:blur(7px);z-index:20;display:flex;align-items:center;justify-content:center;padding:15px}.modal{width:min(520px,100%);max-height:94dvh;overflow-y:auto;background:#151529;border:1px solid #49436c;border-radius:24px;padding:20px;box-shadow:0 30px 90px #000}.modal h2{font-size:24px;margin:0 0 6px}.adminHead{display:flex;align-items:start;justify-content:space-between;gap:10px}.x{background:#ffffff19;border:0;color:#fff;border-radius:10px;width:34px;height:34px;font-size:22px}.adminTabs{display:flex;gap:6px;overflow-x:auto;margin-top:17px;padding-bottom:5px}.tab{background:#ffffff10;border:1px solid #ffffff22;border-radius:12px;color:#ddd8ed;padding:10px 12px;white-space:nowrap;font-size:12px;font-weight:750}.tab.active{background:#874be5;color:#fff}.adminSection{margin-top:18px;padding-top:15px;border-top:1px solid #ffffff27}.adminSection h3{font-size:15px;margin:0 0 8px;color:#ffd47b}.smallHint{font-size:11px;color:#b9b2cf;line-height:1.55}.editItem{background:#ffffff08;border:1px solid #ffffff14;border-radius:15px;padding:12px;margin:12px 0}.miniLbl{font-size:12px;font-weight:750;color:#ddd0fc;margin:3px 0 7px;display:block}.adminInput{display:block;width:100%;background:#090916;border:1px solid #65607b;color:#fff;border-radius:9px;padding:10px;margin:6px 0 10px;outline:none;font-size:13px}.adminInput[type=color]{height:38px;width:65px;padding:3px}.adminInput[type=file]{font-size:11px}.adminTextarea{min-height:75px}.adminRow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.smallBtn{border:1px solid #7a6d99;background:#302748;color:#fff;border-radius:9px;padding:9px 12px;font-size:12px;font-weight:700}.danger{background:#55243e;border-color:#984364}.good{background:#244e40;border-color:#4ea88a}.status{margin:12px 0;color:#d3ffc5;font-size:12px;min-height:14px}.submission{border:1px solid #ffffff25;background:#ffffff08;padding:12px;border-radius:12px;margin:10px 0;font-size:12px;line-height:1.7}.noResults{color:#bdb7d3;font-size:13px;background:#ffffff09;padding:15px;border-radius:12px}.musicBtn{background:#301a46}.navHome{display:inline-flex;gap:5px;align-items:center;margin-top:13px}
@media(max-width:355px){.page{padding-left:17px;padding-right:17px}.hero h1{font-size:49px}.heroArt{height:168px}.bigButton{font-size:12px}.choiceBtn .emoji{font-size:43px}.choiceBtn span{font-size:15px}}@media(min-width:600px){.shell{margin-block:23px;border-radius:35px;min-height:calc(100dvh - 46px)}.overlay{padding:30px}}

<body>
<div class="shell" id="app"><div class="spark"></div><div class="spark"></div><div class="spark"></div><div class="spark"></div><div class="spark"></div><div class="spark"></div><div id="ui"></div></div>
<div id="overlayHost"></div><audio id="bgMusic" loop></audio>
<script>
(()=>{
'use strict';
// Shared online settings and uploaded media are stored on the server.
const defaultConfig={eventTitle:'TARA, PARTY NA!',subtitle:'Isang gabing puno ng tawanan, kwentuhan at masayang bonding. Kasama ka ba?',declineMessage:'Awww, hindi ka makakapunta? 🥹',declineSub:'Sayang naman! Sana sa susunod makasama ka na.',declineNext:'Sige, next time na lang!',endYesText:'YEHEY! KITA-KITS! 🥳',endNoText:'OKAY LANG! MISS KA NAMIN! 💜',venueName:'ANG ATING PARTY VENUE',venueAddress:'I-type dito ang address ng venue sa Admin Panel.',venueInfo:'Huwag kalimutan ang iyong dadalhin. See you!',musicOn:true,
buttons:{homeLeft:{label:'Hindi ako makakapunta',emoji:'🥺',color:'#5c55a0'},homeRight:{label:'SASAMA AKO!',emoji:'🎉',color:'#f23e92'},food:{label:'PAGKAIN',emoji:'🍕',color:'#f09a30'},drink:{label:'INUMIN',emoji:'🍹',color:'#497ce6'},bebot:{label:'BEBOT',emoji:'😏',color:'#a857dd'},own:{label:'AKO NA BAHALA',emoji:'😎',color:'#1dba9b'}},
food:[{label:'Pasta',emoji:'🍝',color:'#9d5ce1'},{label:'Pinoy ulam',emoji:'🍲',color:'#ef7940'},{label:'Pizza',emoji:'🍕',color:'#ec4f81'},{label:'Prutas',emoji:'🍉',color:'#349c79'},{label:'Ako na ang bahala',emoji:'✨',color:'#6a65e6'}],
drink:[{label:'Alak',emoji:'🍻',color:'#9950d9'},{label:'0% na alak',emoji:'🍺',color:'#e08e38'},{label:'Pop',emoji:'🥤',color:'#e95780'},{label:'Juice',emoji:'🧃',color:'#32998f'},{label:'Ako na ang bahala',emoji:'✨',color:'#6369db'}]};
function clone(x){return JSON.parse(JSON.stringify(x))}
function merge(a,b){if(!b||typeof b!=='object')return a;for(let k in b){if(Object.prototype.hasOwnProperty.call(b,k)){if(a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k])&&typeof b[k]==='object'&&!Array.isArray(b[k]))merge(a[k],b[k]);else a[k]=b[k]}}return a}
let cfg=clone(defaultConfig),submissions=[],page='home',mode='',selected='',guestName='',customValue='',pendingSubmission=null,admin=false,adminTab='nilalaman',overlay=false,musicEnabled=false,mediaUrls={},status='',serverMedia={},sending=false;
async function api(route,method='GET',payload){const response=await fetch(route,{method,credentials:'same-origin',headers:payload===undefined?{}:{'Content-Type':'application/json'},body:payload===undefined?undefined:JSON.stringify(payload)});let data={};try{data=await response.json()}catch{}if(!response.ok)throw new Error(data.error||'Hindi makakonekta sa server.');return data}
async function save(){try{await api('/api/admin/settings','POST',{config:cfg});status='✅ Na-save online!';const el=document.getElementById('adminStatus');if(el)el.textContent=status}catch(err){status='❌ Hindi na-save: '+err.message;const el=document.getElementById('adminStatus');if(el)el.textContent=status}}
async function loadSubmissions(){try{const data=await api('/api/admin/submissions');submissions=data.submissions||[]}catch(err){submissions=[];notice(err.message)}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function tint(color){return /^#[0-9a-fA-F]{6}$/.test(color||'')?color:'#6747bb'}
function syncMedia(list){serverMedia=list||{};mediaUrls=Object.fromEntries(Object.entries(serverMedia).map(([key,item])=>[key,item.url]));window.__mediaTypes=Object.fromEntries(Object.entries(serverMedia).map(([key,item])=>[key,item.type]));}
async function putMedia(key,file){const content=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',')[1]);reader.onerror=()=>reject(new Error('Hindi mabasa ang file.'));reader.readAsDataURL(file)});const data=await api('/api/admin/media','POST',{key,type:file.type,data:content});syncMedia(data.media)}
async function deleteMedia(key){const data=await api('/api/admin/media/'+encodeURIComponent(key),'DELETE');syncMedia(data.media)}
async function loadMedia(){const data=await api('/api/state');syncMedia(data.media)}
async function loadMediaTypes(){window.__mediaTypes=Object.fromEntries(Object.entries(serverMedia).map(([key,item])=>[key,item.type]));}
function mediaImg(key,css=''){return mediaUrls[key]?`<img class="${css}" src="${esc(mediaUrls[key])}" alt="Larawang na-upload">`:''}
function btnContents(obj,key){return mediaUrls[key]?mediaImg(key,'buttonPhoto'):`<span class="emoji">${esc(obj.emoji)}</span>`}
function buttonItem(obj,key,action,cls='bigButton'){return `<button class="${cls}" data-action="${action}" style="background:linear-gradient(145deg,${tint(obj.color)},${tint(obj.color)}cf)">${btnContents(obj,key)}<span>${esc(obj.label)}</span></button>`}
function header(){return `<div class="top"><div><div class="brand"><span>INTERACTIVE INVITATION</span></div><div class="tiny">by Cesar Ignacio</div></div><div class="topBtns"><button class="round musicBtn" data-action="music" aria-label="Music">${musicEnabled?'🔊':'🔇'}</button><button class="round" data-action="admin" aria-label="Admin settings">⚙️</button></div></div>`}
function stars(){return ''}
function back(){return `<button class="back" data-action="back">‹ Bumalik</button>`}
function home(){const cover=mediaUrls.cover?mediaImg('cover'):`<button class="coverUpload" data-action="upload-cover" aria-label="I-upload ang picture sa gitna"><span class="coverIcon">📷</span><span class="coverMain">DITO ILALAGAY ANG PICTURE MO</span><span class="coverMinor">I-tap para mag-upload sa Admin Control</span></button>`;return `<section class="page hero"><h1><span class="gradient">${esc(cfg.eventTitle)}</span></h1><p class="sub">${esc(cfg.subtitle)}</p><div class="heroArt ${mediaUrls.cover?'has-cover':''}">${cover}</div><div class="ctaTitle">PIPILI KA BA? 👇</div><div class="two">${buttonItem(cfg.buttons.homeLeft,'homeLeft','decline')}${buttonItem(cfg.buttons.homeRight,'homeRight','join')}</div><p class="hint">🎵 Pindutin ang 🔇 para sa music</p><p class="bottomNote">Interactive Invitation by Cesar Ignacio</p></section>`}
function options(){const keys=['food','drink','bebot','own'];return `<section class="page">${back()}<div class="eyebrow">🎉 GAME NA!</div><div class="step">STEP 1 / 3</div><h2 class="pageTitle">ANO ANG TRIP<br> MONG DALHIN?</h2><p class="pageDesc">Pumili ng isa sa apat. Iba-iba ang sorpresa sa bawat pindot!</p><label class="fieldLabel" for="guestInput">Pangalan mo (optional, para makilala ang sagot mo)</label><input class="field" id="guestInput" value="${esc(guestName)}" placeholder="I-type ang pangalan mo"><div class="four">${keys.map(k=>buttonItem(cfg.buttons[k],k,'pick-'+k,'choiceBtn')).join('')}</div><p class="hint">Puwedeng palitan ni Admin ang lahat ng buttons at larawan.</p></section>`}
function choices(){const type=mode==='food'?'PAGKAIN':'INUMIN';const items=cfg[mode];return `<section class="page">${back()}<div class="eyebrow">${mode==='food'?'🍽️ FOOD TRIP':'🍹 DRINKS TIME'}</div><div class="step">STEP 2 / 3</div><h2 class="pageTitle">PILI KA NG<br>${type}!</h2><p class="pageDesc">Pindutin kung ano ang dadalhin mo. May click sound ang bawat button.</p><div class="group">${items.map((o,i)=>`<button class="option" data-action="choice-${i}" style="border-left:5px solid ${tint(o.color)}">${mediaUrls[mode+'-'+i]?mediaImg(mode+'-'+i,'optImg'):`<span class="optIcon">${esc(o.emoji)}</span>`}<span>${esc(o.label)}</span><span class="chev">›</span></button>`).join('')}</div></section>`}
function custom(){return `<section class="page">${back()}<div class="eyebrow">✨ SURPRISE MO KAMI</div><h2 class="pageTitle">IKAW NA<br>ANG BAHALA!</h2><p class="pageDesc">Sabihin mo kung ano ang dadalhin mo sa party.</p><label class="fieldLabel" for="customInput">Ano ang dadalhin mo?</label><textarea id="customInput" class="field" placeholder="Halimbawa: Lechon, ice cream, desserts...">${esc(customValue)}</textarea><button class="primary" data-action="submit-custom">I-SUBMIT ANG SAGOT ➜</button></section>`}
function venue(){return `<section class="page">${back()}<div class="eyebrow">📍 SEE YOU THERE!</div><div class="step">STEP 3 / 3</div><h2 class="pageTitle">DITO ANG<br>PARTY NATIN!</h2><div class="address"><div class="pin">📍</div><strong>${esc(cfg.venueName)}</strong><p>${esc(cfg.venueAddress)}</p><div class="pill">🎊 ${esc(cfg.venueInfo)}</div></div><button class="primary" data-action="done">AYOS NA! ✓</button></section>`}
function ending(which){const txt=which==='yes'?cfg.endYesText:cfg.endNoText;const mediaKey=which==='yes'?'endingYes':'endingNo';const file=mediaUrls[mediaKey];const mime=window.__mediaTypes?.[mediaKey]||'';const media=file?(mime.startsWith('video/')?`<video controls playsinline src="${esc(file)}"></video>`:mediaImg(mediaKey)):`<div style="font-size:95px">${which==='yes'?'🥳':'💜'}</div>`;return `<section class="page"> <div class="eyebrow">${which==='yes'?'🎊 SEE YOU AT THE PARTY':'💌 UNTIL NEXT TIME'}</div><h2 class="endMessage">${esc(txt)}</h2><div class="endMedia">${media}</div><p class="pageDesc" style="text-align:center">${which==='yes'?'Salamat sa pagsali. Sama-sama tayong magsaya!':'Salamat sa pagsagot! Sana makasama ka sa susunod.'}</p><button class="primary" data-action="final-submit">ISUBMIT ✓</button></section>`}
function completed(){return `<section class="page" style="text-align:center;padding-top:58px"><div style="font-size:96px;line-height:1.2">✅</div><div class="eyebrow">🎊 TAPOS NA!</div><h2 class="endMessage" style="margin-top:23px">SALAMAT!<br>NA-SUBMIT NA!</h2><p class="pageDesc" style="font-size:16px;max-width:330px;margin:14px auto 25px">Tapos na ang invitation. Puwede mo nang isara ang page. 🥳</p><div style="padding:16px;border:1px solid #e2e3f0;background:#faf9ff;border-radius:18px;font-size:12px;line-height:1.7;color:#687083">✅ Naipadala na ang sagot mo sa organizer!</div></section>`}
function bebot(){return `<section class="page">${back()}<div class="eyebrow">😏 HOY, NAKO!</div><h2 class="pageTitle">BEBOT?! 👀</h2><p class="pageDesc">Eto ang surprise picture ni Admin!</p><div class="bebot">${mediaUrls.bebotPhoto?mediaImg('bebotPhoto'):`<div><div style="font-size:110px">🙈</div><p class="pageDesc">May picture na ilalagay si Admin dito.</p></div>`}</div><button class="primary" data-action="return-options">BUMALIK SA DATING PAGE,<br> MAGPAKABAIT KA NA! 😂</button></section>`}
function decline(){return `<section class="page" style="text-align:center">${back()}<div style="font-size:91px;margin-top:60px">🥹</div><div class="eyebrow">💔 SAD NAMAN...</div><h2 class="pageTitle" style="font-size:39px;white-space:pre-line">${esc(cfg.declineMessage)}</h2><p class="pageDesc">${esc(cfg.declineSub)}</p><label class="fieldLabel" for="guestInput">Pangalan mo (optional)</label><input class="field" id="guestInput" value="${esc(guestName)}" placeholder="I-type ang pangalan mo"><button class="primary" style="margin-top:22px" data-action="decline-next">${esc(cfg.declineNext)} ➜</button></section>`}
function render(){const screens={home,options,choices,custom,venue,bebot,decline,complete:completed};document.getElementById('ui').innerHTML=header()+(screens[page]?.()??ending(page==='endNo'?'no':'yes'));if(overlay)renderAdmin()}
function goto(next){page=next;window.scrollTo({top:0,behavior:'instant'});render()}
async function finishInvitation(){
  if(!pendingSubmission)return notice('Pumili muna ng sagot bago mag-submit.');
  if(sending)return;
  sending=true;
  const b=document.querySelector('[data-action="final-submit"]');if(b){b.disabled=true;b.textContent='IPINAPADALA...';}
  try{await api('/api/submit','POST',{id:(window.crypto?.randomUUID?.()||'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.floor(Math.random()*16);return(c==='x'?r:((r&3)|8)).toString(16)})),name:guestName.trim()||'Hindi naglagay ng pangalan',group:pendingSubmission.group,answer:pendingSubmission.answer});pendingSubmission=null;goto('complete')}
  catch(err){notice('Hindi na-submit: '+err.message);if(b){b.disabled=false;b.textContent='ISUBMIT ✓'}}finally{sending=false}
}
function playClick(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const ctx=window.__clickCtx||(window.__clickCtx=new A());ctx.resume();const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='triangle';osc.frequency.setValueAtTime(610,ctx.currentTime);osc.frequency.exponentialRampToValueAtTime(305,ctx.currentTime+.085);gain.gain.setValueAtTime(.13,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.115);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.115)}catch{}}
function notice(msg){status=msg;const el=document.getElementById('adminStatus');if(el)el.textContent=msg;else if(!overlay)alert(msg)}
function musicToggle(){const music=document.getElementById('bgMusic');if(!mediaUrls.music){notice('Wala pang music. Puwedeng mag-upload sa Admin → Media.');return}if(music.paused){music.play().then(()=>{musicEnabled=true;render()}).catch(()=>notice('Pindutin muli ang music icon para i-play.'))}else{music.pause();musicEnabled=false;render()}}
function wireMusic(){const music=document.getElementById('bgMusic');if(mediaUrls.music){if(music.src!==mediaUrls.music)music.src=mediaUrls.music;music.volume=.35}else{music.pause();music.removeAttribute('src');musicEnabled=false}}
function backPage(){if(page==='options'||page==='decline')return goto('home');if(page==='choices'||page==='bebot'||page==='venue'&&selected==='sarili')return goto('options');if(page==='custom')return goto('choices');if(page==='venue')return goto('choices');goto('home')}
document.addEventListener('input',e=>{if(e.target.id==='guestInput')guestName=e.target.value;if(e.target.id==='customInput')customValue=e.target.value});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;playClick();if(a==='music')return musicToggle();if(a==='admin'||a==='upload-cover'){overlay=true;adminTab='nilalaman';return renderAdmin(true)}if(a==='back')return backPage();if(a==='join'){pendingSubmission=null;return goto('options')};if(a==='decline'){pendingSubmission={group:'Attendance',answer:'Hindi makakapunta'};return goto('decline')}if(a==='decline-next')return goto('endNo');if(a==='pick-food'||a==='pick-drink'){mode=a.split('-')[1];return goto('choices')}if(a==='pick-bebot')return goto('bebot');if(a==='pick-own'){selected='sarili';pendingSubmission={group:'Ambag',answer:'Ako na ang bahala'};return goto('venue')}if(a==='return-options')return goto('options');if(a.startsWith('choice-')){const index=Number(a.split('-')[1]);const arr=cfg[mode];if(!arr||!arr[index])return;if(index===arr.length-1){selected='custom';customValue='';return goto('custom')}selected=arr[index].label;pendingSubmission={group:mode==='food'?'Pagkain':'Inumin',answer:selected};return goto('venue')}if(a==='submit-custom'){customValue=document.getElementById('customInput').value.trim();if(!customValue)return alert('Pakilagay muna kung ano ang dadalhin mo.');pendingSubmission={group:mode==='food'?'Pagkain':'Inumin',answer:customValue};return goto('venue')}if(a==='done')return goto('endYes');if(a==='final-submit')return finishInvitation();if(a==='close-admin'){overlay=false;renderAdmin()}if(a==='unlock'){try{await api('/api/admin/login','POST',{password:document.getElementById('pinEntry')?.value||''});admin=true;adminTab='nilalaman';renderAdmin()}catch(err){notice(err.message)}}if(a==='admin-tab'){adminTab=b.dataset.tab;status='';if(adminTab==='sagot')await loadSubmissions();return renderAdmin()}if(a==='delete-media'){try{await deleteMedia(b.dataset.key);wireMusic();render();notice('Naalis ang media.')}catch(err){notice(err.message)}}if(a==='export-responses')return exportResponses();if(a==='clear-responses'){if(confirm('Burahin ang lahat ng natanggap na submissions online?')){try{await api('/api/admin/clear-submissions','POST',{});await loadSubmissions();renderAdmin();notice('Na-clear ang mga sagot.')}catch(err){notice(err.message)}}}if(a==='reset-config'){if(confirm('Ibalik ang mga default na text at kulay? Hindi mabubura ang uploaded files.')){cfg=clone(defaultConfig);save();render();notice('Na-reset ang settings.')}}if(a==='logout'){await api('/api/admin/logout','POST',{});admin=false;overlay=false;renderAdmin();notice('Naka-log out na.')}
});
function mkField(label,path,value,multiline=false){return `<label class="miniLbl">${esc(label)}${multiline?`<textarea class="adminInput adminTextarea" data-bind="${esc(path)}">${esc(value)}</textarea>`:`<input class="adminInput" data-bind="${esc(path)}" value="${esc(value)}">`}</label>`}
function mediaEditor(label,key,types='image/*,video/*'){const active=!!mediaUrls[key];return `<div class="editItem"><label class="miniLbl">${esc(label)}</label><input class="adminInput" type="file" accept="${types}" data-media="${esc(key)}"><div class="adminRow"><span class="smallHint">${active?'✅ May naka-upload nang file':'Wala pang media'}</span>${active?`<button class="smallBtn danger" data-action="delete-media" data-key="${esc(key)}">Alisin</button>`:''}</div></div>`}
function btnEdit(title,obj,path,key){return `<div class="editItem"><label class="miniLbl">${esc(title)}</label><div class="adminRow" style="gap:8px"><div style="flex:3;min-width:130px">${mkField('Text sa button',path+'.label',obj.label)}</div><div style="flex:1;min-width:63px">${mkField('Emoji',path+'.emoji',obj.emoji)}</div></div><div class="adminRow"><label class="miniLbl">Kulay: <input class="adminInput" type="color" value="${tint(obj.color)}" data-bind="${esc(path+'.color')}"></label></div><label class="miniLbl">Picture sa button (optional)<input class="adminInput" type="file" accept="image/*" data-media="${esc(key)}"></label>${mediaUrls[key]?`<button class="smallBtn danger" data-action="delete-media" data-key="${esc(key)}">Alisin ang larawan</button>`:''}</div>`}
function getPath(obj,p){return p.split('.').reduce((v,k)=>v?.[k],obj)}
function setPath(obj,path,value){const parts=path.split('.');let target=obj;while(parts.length>1){const key=parts.shift();if(target[key]===undefined)return;target=target[key]}target[parts[0]]=value}
function editorContent(){switch(adminTab){case'nilalaman':return `<div class="adminSection"><h3>🏠 First page</h3>${mkField('Malaking title','eventTitle',cfg.eventTitle)}${mkField('Description sa ilalim','subtitle',cfg.subtitle,true)}${mediaEditor('I-upload ang malaking picture sa gitna','cover','image/*')}</div><div class="adminSection"><h3>💔 Left side / Hindi pupunta</h3>${mkField('Malaking text','declineMessage',cfg.declineMessage,true)}${mkField('Maliit na text','declineSub',cfg.declineSub,true)}${mkField('Button sa baba','declineNext',cfg.declineNext)}</div><div class="adminSection"><h3>🎉 Final messages</h3>${mkField('Final text kapag pupunta','endYesText',cfg.endYesText,true)}${mkField('Final text kapag hindi pupunta','endNoText',cfg.endNoText,true)}</div>`;
case'buttons':return `<div class="adminSection"><h3>🚪 Dalawang buttons sa first page</h3>${btnEdit('Kaliwa',cfg.buttons.homeLeft,'buttons.homeLeft','homeLeft')}${btnEdit('Kanan',cfg.buttons.homeRight,'buttons.homeRight','homeRight')}</div><div class="adminSection"><h3>🔲 Apat na square buttons</h3>${['food','drink','bebot','own'].map((key,i)=>btnEdit(['1 — Pagkain','2 — Inumin','3 — Bebot','4 — Ako na bahala'][i],cfg.buttons[key],'buttons.'+key,key)).join('')}</div><div class="adminSection"><h3>🍝 Mga button sa Pagkain</h3>${cfg.food.map((o,i)=>btnEdit('Pagkain #'+(i+1),o,'food.'+i,'food-'+i)).join('')}</div><div class="adminSection"><h3>🍹 Mga button sa Inumin</h3>${cfg.drink.map((o,i)=>btnEdit('Inumin #'+(i+1),o,'drink.'+i,'drink-'+i)).join('')}</div>`;
case'media':return `<div class="adminSection"><h3>📍 Venue / Address</h3>${mkField('Pangalan ng venue','venueName',cfg.venueName)}${mkField('Complete address','venueAddress',cfg.venueAddress,true)}${mkField('Mensahe sa venue','venueInfo',cfg.venueInfo)}</div><div class="adminSection"><h3>📸 Special picture</h3>${mediaEditor('Bebot surprise picture','bebotPhoto','image/*')}</div><div class="adminSection"><h3>🎞️ Last page: photo OR video</h3>${mediaEditor('Ending kapag pupunta','endingYes','image/*,video/*')}${mediaEditor('Ending kapag hindi pupunta','endingNo','image/*,video/*')}</div><div class="adminSection"><h3>🎶 Background music</h3>${mediaEditor('Musika (.mp3, .m4a, .wav)','music','audio/*')}<p class="smallHint">Music ay tutunog matapos pindutin ng bisita ang sound icon. May click sound ang lahat ng buttons.</p></div>`;
case'sagot':return `<div class="adminSection"><h3>📩 Online submissions (${submissions.length})</h3><p class="smallHint">Lahat ng sagot na ipinadala ng mga bisita ay dito makikita sa Admin Panel.</p><div class="adminRow"><button class="smallBtn good" data-action="export-responses">⬇️ I-export bilang CSV</button><button class="smallBtn danger" data-action="clear-responses">Burahin ang lahat ng sagot</button></div>${submissions.length?submissions.map(s=>`<div class="submission"><b>${esc(s.name)}</b> · <span style="color:#afa5c2">${esc(new Date(s.when).toLocaleString('en-CA'))}</span><div>📌 ${esc(s.group)}: <strong>${esc(s.answer)}</strong></div></div>`).join(''):`<p class="noResults">Wala pang sagot. Subukan munang pindutin ang mga options sa invitation.</p>`}</div>`;
case'settings':return `<div class="adminSection"><h3>🔐 Admin password</h3><p class="smallHint">Ang secure admin password ay naka-set sa ADMIN_PASSWORD sa Render environment settings. Hindi ito makikita ng bisita.</p><button class="smallBtn danger" data-action="logout">Mag-log out</button></div><div class="adminSection"><h3>🧪 Testing</h3><button class="smallBtn danger" data-action="reset-config">I-reset ang text at colors</button><p class="smallHint">Ang mga pagbabago ay sina-save online at makikita ng lahat ng bibisita sa link.</p></div>`;
}}
function renderAdmin(focusPin=false){const host=document.getElementById('overlayHost');if(!overlay){host.innerHTML='';return}host.innerHTML=`<div class="overlay"><div class="modal"><div class="adminHead"><div><h2>⚙️ ADMIN CONTROL</h2><p class="smallHint" style="margin:2px 0">Ikaw ang mag-eedit ng mga button at content.</p></div><button class="x" data-action="close-admin">×</button></div>${!admin?`<div class="adminSection"><h3>🔒 Admin login</h3><p class="smallHint">Ilagay ang private admin password na itinakda sa Render.</p><input id="pinEntry" class="adminInput" type="password" placeholder="Admin password" autocomplete="current-password"><button class="primary" data-action="unlock">PUMASOK SA ADMIN</button></div>`:`<div class="adminTabs">${[['nilalaman','✏️ Text'],['buttons','🟪 Buttons'],['media','📍 Media'],['sagot','📩 Sagot'],['settings','🔐 Settings']].map(([id,txt])=>`<button class="tab ${adminTab===id?'active':''}" data-action="admin-tab" data-tab="${id}">${txt}</button>`).join('')}</div>${editorContent()}<div class="status" id="adminStatus">${esc(status||'Nase-save online kapag tinapos mong i-edit ang field.')}</div>`}</div></div>`;if(focusPin&&!admin)document.getElementById('pinEntry')?.focus()}
document.addEventListener('change',async e=>{const f=e.target;if(f.matches('[data-bind]')){setPath(cfg,f.dataset.bind,f.value);await save();render();const el=document.getElementById('adminStatus');if(el)el.textContent=status;return}if(f.matches('[data-media]')){const file=f.files?.[0];if(!file)return;if(file.size>18*1024*1024){notice('Masyadong malaki ang file. Hanggang 18MB lang ang puwede.');return}try{await putMedia(f.dataset.media,file);window.__mediaTypes=window.__mediaTypes||{};window.__mediaTypes[f.dataset.media]=file.type;await loadMedia();await loadMediaTypes();wireMusic();render();notice('✅ Naka-save ang '+file.name)}catch(err){notice('Hindi ma-save ang media: '+err.message)}}});
function exportResponses(){const heads=['Date','Name','Category','Answer'];const rows=[heads,...submissions.map(s=>[s.when,s.name,s.group,s.answer])];const csv='\ufeff'+rows.map(r=>r.map(v=>{const safe=String(v).replace(/^[=+@\-\t\r]/,m=>"'"+m);return '"'+safe.replaceAll('"','""')+'"'}).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const link=document.createElement('a');const url=URL.createObjectURL(blob);link.href=url;link.download='mga-sagot-imbita.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
(async()=>{try{const data=await api('/api/state');cfg=merge(clone(defaultConfig),data.config);syncMedia(data.media);wireMusic();render()}catch(err){document.getElementById('ui').innerHTML='<section class="page"><h2 class="pageTitle">Hindi makakonekta sa server</h2><p class="pageDesc">Buksan ang app gamit ang online URL mula sa Render. '+esc(err.message)+'</p><button class="primary" onclick="location.reload()">ULITIN</button></section>'}})()
})();
</script>
</body></html>
